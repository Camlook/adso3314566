<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04-Data Types</title>
    <link rel="stylesheet" href="../src/css/js.css">
</head>

<body>
    <div class="bg-tunnel-container">
        <div class="scene">
            <div class="wrapper">
                <div class="tunnel"></div>
            </div>
        </div>
    </div>

    <a href="/04-js/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#ffff" viewBox="0 0 256 256">
            <path
                d="M232,200a8,8,0,0,1-16,0,88.1,88.1,0,0,0-88-88H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,85.66,61.66L51.31,96H128A104.11,104.11,0,0,1,232,200Z">
            </path>
        </svg>
    </a>

    <main>
        <header>
            <h1>04-Data Types</h1> <br>
            <h2>Store and manage data using variables.</h2>
        </header>
        <section>
            <h3>Type String: <small class="type-string"></small></h3>
            <h3>Type Number: <small class="type-number"></small></h3>
            <h3>Type Boolean: <small class="type-boolean"></small></h3>
            <h3>Type Null: <small class="type-null"></small></h3>
            <h3>Type Undefined: <small class="type-undefined"></small></h3>
            <h3>Type Array: <small class="type-array"></small></h3>
            <h3>Type Object: <small class="type-object"></small></h3>
        </section>
    </main>
    <script>
        //Type String
        const tstring = document.querySelector('.type-string');
        const message = 'Hello JS 💛';
        tstring.textContent = `${message} - Length:
                               ${message.length}: Characters`;
        
        //Type Number
        const tnumber = document.querySelector('.type-number');
        const num1 = '45';
        const num2 = 12.4;
        tnumber.textContent = `(45+12.4) --> ${parseInt(num1)+num2}`;

        //Type Boolean
        const tboolean = document.querySelector('.type-boolean');
        const isTrue = (4>8);
        tboolean.textContent =`4>8? --> ${isTrue}`;

        //Type Null
        const tnull = document.querySelector('.type-null');
        const isCreated = null;
        tnull.textContent = `isCreated --> ${isCreated}`;

        //Type Undefined
        const tundefined = document.querySelector('.type-undefined');
        const isBinary = undefined;
        tundefined.textContent = `isBinary --> ${isBinary}`;

        //Type Array
        const tarray = document.querySelector('.type-array');
        const landscapes = ['🏙️','🌆','🌄','🌁','🌌','🌇'];
        tarray.textContent = `Landscapes --> ${landscapes}`

        //Type Object
        const tobject = document.querySelector('.type-object');
        const hashira = {
            name: 'Kyojuro Rengoku',
            type: '🔥',
            age: 24
        }
        tobject.textContent = `${hashira.name} --> ${hashira.type}`
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tunnel = document.querySelector('.tunnel');
            for (let s = 0; s < 4; s++) {
                const side = document.createElement('div');
                side.className = 'side';
                for (let st = 0; st < 20; st++) {
                    const stroke = document.createElement('div');
                    stroke.className = 'stroke';
                    for (let sq = 0; sq < 10; sq++) {
                        const square = document.createElement('div');
                        square.className = 'square';
                        stroke.appendChild(square);
                    }
                    side.appendChild(stroke);
                }
                tunnel.appendChild(side);
            }
            const side5 = document.createElement('div'); side5.className = 'side'; tunnel.appendChild(side5);
            const hl1 = document.createElement('div'); hl1.className = 'side highlight'; tunnel.appendChild(hl1);
            const hl2 = document.createElement('div'); hl2.className = 'side highlight'; tunnel.appendChild(hl2);
        });
    </script>
</body>

</html>
