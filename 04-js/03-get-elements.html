<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03-Get Elements</title>
    <link rel="stylesheet" href="../src/css/js.css">
    <style>
        section {
            ul {
                padding: 0;
            }

            ul li,
            figure.animal {
                background-color: #0006;
                border-radius: 2px;
                height: 25px;
                margin: 2px auto;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 25px;
                zoom: 2.5;
            }
        }
    </style>
</head>

<body>
    <div class="bg-tunnel-container">
        <div class="scene">
            <div class="wrapper">
                <div class="tunnel"></div>
            </div>
        </div>
    </div>

    <a href="/04-js/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#ffff" viewBox="0 0 256 256">
            <path
                d="M232,200a8,8,0,0,1-16,0,88.1,88.1,0,0,0-88-88H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,85.66,61.66L51.31,96H128A104.11,104.11,0,0,1,232,200Z">
            </path>
        </svg>
    </a>

    <main>
        <header>
            <h1>03-Get Elements</h1> <br>
            <h2>Access and manipulate HTML elements using JavaScript.</h2>
        </header>
        <section>
            <h3>Get Element By Id:</h3>
            <h4 id="year"></h4>
            <h3>Get Elements By Tag Name:</h3>
            <ul>
                <li>🍎</li>
                <li>🫐</li>
                <li>🍊</li>
                <li>🍒</li>
            </ul>
            <h4></h4>
            <h3>Get Elements By Class Name</h3>
            <p class="paragraph">Lorem ipsum dolor</p>
            <p class="paragraph">Lorem ipsum dolor</p>
            <p class="paragraph">Lorem ipsum dolor</p>
            <h3>Query Selector & Query Selector All</h3>
            <figure class="animal first">🦊</figure>
            <figure class="animal">🐼</figure>
            <figure class="animal">🐷</figure>
        </section>
        <script>
            // Get Element by ID
            const year = document.getElementById('year');
            const ndate = new Date;
            year.textContent = `Current Year:
                                ${ndate.getUTCFullYear()}`;
            // Get Elements by TagName
            const fruits = document.getElementsByTagName('li')
            const h4s = document.getElementsByTagName('h4')

            h4s[1].textContent = `There are ${fruits.length} fruits. `
            h4s[1].innerHTML += `<br> The first fruit is ${fruits[0].textContent}`;
            h4s[1].innerHTML += `<br> The last fruit is ${fruits[fruits.length - 1].textContent}`;

            // Get Elements by ClassName
            const ps = document.getElementsByClassName('paragraph')
            ps[1].textContent = 'New text value'
            ps[1].style.backgroundColor = 'crimson'
            ps[1].style.color = 'white'
            ps[1].style.padding = '0.4rem'

            // QuerySelector
            const first = document.querySelector('figure.first')
            first.style.backgroundColor = 'orange'

            const animals = document.querySelectorAll('figure.animal');

            animals.forEach(animal => {
                animal.style.borderRadius = '50%';
            });

        </script>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tunnel = document.querySelector('.tunnel');
            for (let s = 0; s < 4; s++) {
                const side = document.createElement('div');
                side.className = 'side';
                for (let st = 0; st < 20; st++) {
                    const stroke = document.createElement('div');
                    stroke.className = 'stroke';
                    for (let sq = 0; sq < 10; sq++) {
                        const square = document.createElement('div');
                        square.className = 'square';
                        stroke.appendChild(square);
                    }
                    side.appendChild(stroke);
                }
                tunnel.appendChild(side);
            }
            const side5 = document.createElement('div'); side5.className = 'side'; tunnel.appendChild(side5);
            const hl1 = document.createElement('div'); hl1.className = 'side highlight'; tunnel.appendChild(hl1);
            const hl2 = document.createElement('div'); hl2.className = 'side highlight'; tunnel.appendChild(hl2);
        });
    </script>
</body>

</html>
