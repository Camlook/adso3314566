<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07-Class Vehicle</title>
    <link rel="stylesheet" href="../src/css/js.css">
    <style>
        section {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        div.vehicle {
            border-radius: 8px;
            background-color: rgb(253, 253, 253);
            height: 627px;
            width: 380px;
            margin: 0 auto;

            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 12px;

                figure.logo {
                    background: url(imgs/logow.png) no-repeat center / cover;
                    height: 81px;
                    width: 243px;
                    margin: 0;
                }

                button.mode {
                    background: url(imgs/mode-dark.svg) no-repeat center / cover;
                    height: 60px;
                    width: 90px;
                    transition: transform 0.2s ease-in;
                    border: none;
                    cursor: pointer;

                    &:hover {
                        transform: scale(1.02);
                    }
                }
            }

            nav {
                display: grid;
                grid-template-columns: 70px 202px 70px;
                justify-content: center;
                align-items: center;
                column-gap: 15px;
                margin-top: 20px;

                button {
                    border: none;
                    cursor: pointer;
                    height: 60px;
                    padding: 0;
                    transition: transform 0.2s ease-in;
                    color: #141516;

                    &:hover {
                        transform: scale(1.01);
                    }

                    &.prev {
                        width: 70px;
                        background: url(imgs/prev.svg) no-repeat center / contain;
                    }

                    &.brand {
                        color: #141516;
                        width: 202px;
                        background: url(imgs/brand.svg) no-repeat center / contain;
                    }

                    &.next {
                        width: 70px;
                        background: url(imgs/next.svg) no-repeat center / contain;
                    }
                }
            }

            > div:not(.bg-menu-wrapper) {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 20px;
                margin-top: 16px;

                figure {
                    margin: 0;
                    padding: 0;
                    display: flex;
                    justify-content: center;
                    align-items: end;
                    padding-bottom: 15px;
                    height: 90px;
                    width: 110px;
                    color: #141516;

                    &.model {
                        background: url(imgs/model.svg) no-repeat center;
                    }

                    &.refer {
                        background: url(imgs/refer.svg) no-repeat center;
                    }

                    &.color {
                        background: url(imgs/color.svg) no-repeat center;
                    }
                }
            }

            > div.bg-menu-wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 0;
                margin-top: 20px;
            }

            figure.bg.parallax-container {
                position: relative;
                display: flex;
                margin: 0 auto;
                width: 360px;
                height: 240px;
                border-radius: 8px;
                overflow: hidden;
                background: #87CEEB;
            }

            .parallax-layer {
                position: absolute;
                top: 0;
                left: 0;
                width: 720px;
                height: 100%;
                background-repeat: repeat-x;
                will-change: background-position;
            }

            figure.sp01 {
                position: absolute;
                z-index: 10;
                background: url('imgs/sp01.png') no-repeat center / contain;
                width: 170px;
                height: 68px;
                bottom: 80px;
                left: 0;
                right: 0;
                margin: 0 auto;
                transition: opacity 0.3s ease;
            }

            menu {
                align-items: center;
                display: flex;
                flex-direction: row;
                margin: 0;
                margin-top: 25px;
                padding: 0;
                justify-content: space-between;
                width: 356px;

                button {
                    height: 68px;
                    width: 68px;
                    border: none;
                    background-color: transparent;
                    background-repeat: no-repeat;
                    background-position: center;
                    background-size: contain;
                    padding: 0;
                    cursor: pointer;
                    outline: none;
                    -webkit-appearance: none;
                    appearance: none;
                    box-shadow: none;
                    transition: transform 0.2s ease-in;

                    &:hover { transform: scale(1.05); }
                    &:active { transform: scale(0.95); }
                }
            }

            &:not(.dark) {
                .bgstars,
                .cloud1,
                .cloud2,
                .cloud3,
                .cloud4,
                .mountain1,
                .mountain2,
                .mountain3 {
                    background-color: transparent;
                }

                .bgstars {
                    background-image: url('imgs/bglight/bgsky.png');
                    background-size: auto 100%;
                    background-position: 0 0;
                    background-repeat: repeat-x;
                    z-index: 1;
                }

                .cloud1 {
                    background-image: url('imgs/bglight/cloud1.png');
                    background-size: auto 25%;
                    background-position-x: 0;
                    background-position-y: 0%;
                    background-repeat: repeat-x;
                    z-index: 2;
                }

                .cloud2 {
                    background-image: url('imgs/bglight/cloud2.png');
                    background-size: auto 20%;
                    background-position-x: 0;
                    background-position-y: 22%;
                    background-repeat: repeat-x;
                    z-index: 3;
                }

                .cloud3 {
                    background-image: url('imgs/bglight/cloud3.png');
                    background-size: auto 30%;
                    background-position-x: 0;
                    background-position-y: 42%;
                    background-repeat: repeat-x;
                    z-index: 4;
                }

                .cloud4 {
                    background-image: url('imgs/bglight/cloud4.png');
                    background-size: auto 22%;
                    background-position-x: 0;
                    background-position-y: 62%;
                    background-repeat: repeat-x;
                    z-index: 5;
                }

                .mountain3 {
                    background-image: none;
                }

                .mountain2 {
                    background-image: url('imgs/bglight/mountains2.png');
                    background-size: auto 200%;
                    background-position-x: 0;
                    background-position-y: bottom;
                    background-repeat: repeat-x;
                    top: auto;
                    bottom: -10px;
                    height: 100%;
                    z-index: 7;
                }

                .mountain1 {
                    background-image: url('imgs/bglight/mountains1.png');
                    background-size: auto 110%;
                    background-position-x: 0;
                    background-position-y: bottom;
                    background-repeat: repeat-x;
                    top: auto;
                    bottom: -20px;
                    height: 100%;
                    z-index: 8;
                }
            }

            &.dark {
                background-color: black;

                header {
                    figure.logo {
                        background: url(imgs/logod.png) no-repeat center / 95%;
                    }

                    button.mode {
                        background: url(imgs/mode-light.svg) no-repeat center / cover;
                    }
                }

                nav button {
                    color: white;

                    &.prev {
                        background: url(imgs/prevd.svg) no-repeat center / contain;
                    }

                    &.brand {
                        color: white;
                        background: url(imgs/brandd.svg) no-repeat center / contain;
                    }

                    &.next {
                        background: url(imgs/nextd.svg) no-repeat center / contain;
                    }
                }

                > div:not(.bg-menu-wrapper) figure {
                    color: white;

                    &.model {
                        background: url(imgs/modeld.svg) no-repeat center;
                    }

                    &.refer {
                        background: url(imgs/referd.svg) no-repeat center;
                    }

                    &.color {
                        background: url(imgs/colord.svg) no-repeat center;
                    }
                }

                figure.bg.parallax-container {
                    background: #05080f;
                }

                .bgstars {
                    background-image: url('imgs/bgdark/bgstars.png');
                    background-size: auto 100%;
                    background-position: 0 0;
                    background-repeat: repeat-x;
                    z-index: 1;
                }

                .cloud1 {
                    background-image: url('imgs/bgdark/cloud1.png');
                    background-size: auto 35%;
                    background-position-x: 0;
                    background-position-y: 15%;
                    background-repeat: repeat-x;
                    z-index: 2;
                }

                .cloud2 {
                    background-image: url('imgs/bgdark/cloud2.png');
                    background-size: auto 30%;
                    background-position-x: 0;
                    background-position-y: 35%;
                    background-repeat: repeat-x;
                    z-index: 3;
                }

                .cloud3 {
                    background-image: url('imgs/bgdark/cloud3.png');
                    background-size: auto 40%;
                    background-position-x: 0;
                    background-position-y: 55%;
                    background-repeat: repeat-x;
                    z-index: 4;
                }

                .cloud4 {
                    background-image: url('imgs/bgdark/cloud4.png');
                    background-size: auto 35%;
                    background-position-x: 0;
                    background-position-y: 75%;
                    background-repeat: repeat-x;
                    z-index: 5;
                }

                .mountain3 {
                    background-image: url('imgs/bgdark/mountain3.png');
                    background-size: auto 90%;
                    background-position-x: 0;
                    background-position-y: bottom;
                    background-repeat: repeat-x;
                    top: auto;
                    bottom: -90px;
                    height: 100%;
                    z-index: 6;
                }

                .mountain2 {
                    background-image: url('imgs/bgdark/mountain2.png');
                    background-size: auto 85%;
                    background-position-x: 0;
                    background-position-y: bottom;
                    background-repeat: repeat-x;
                    top: auto;
                    bottom: -90px;
                    height: 100%;
                    z-index: 7;
                }

                .mountain1 {
                    background-image: url('imgs/bgdark/mountain1.png');
                    background-size: auto 70%;
                    background-position-x: 0;
                    background-position-y: bottom;
                    background-repeat: repeat-x;
                    top: auto;
                    bottom: -30px;
                    height: 100%;
                    z-index: 8;
                }
            }

            &.dark menu button {
                &.btn-on       { background-image: url(imgs/btn-on.svg); }
                &.btn-off      { background-image: url(imgs/btn-off.svg); }
                &.btn-backward { background-image: url(imgs/btn-back.svg); }
                &.btn-stop     { background-image: url(imgs/btn-stop.svg); }
                &.btn-forward  { background-image: url(imgs/btn-forward.svg); }
            }

            &:not(.dark) menu button {
                &.btn-on       { background-image: url(imgs/btn-on-light.svg); }
                &.btn-off      { background-image: url(imgs/btn-off-light.svg); }
                &.btn-backward { background-image: url(imgs/btn-back-light.svg); }
                &.btn-stop     { background-image: url(imgs/btn-stop-light.svg); }
                &.btn-forward  { background-image: url(imgs/btn-forward-light.svg); }
            }
        }
    </style>
</head>

<body>
    <div class="bg-tunnel-container">
        <div class="scene">
            <div class="wrapper">
                <div class="tunnel"></div>
            </div>
        </div>
    </div>

    <a href="/04-js/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#ffff" viewBox="0 0 256 256">
            <path
                d="M232,200a8,8,0,0,1-16,0,88.1,88.1,0,0,0-88-88H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,85.66,61.66L51.31,96H128A104.11,104.11,0,0,1,232,200Z">
            </path>
        </svg>
    </a>

    <main>
        <header>
            <h1>07-Class Vehicle</h1> <br>
            <h2>Create and manipulate a vehicle object with properties.</h2>
        </header>
        <section>
            <div class="vehicle">
                <header>
                    <figure class="logo"></figure>
                    <button class="mode"></button>
                </header>

                <nav>
                    <button class="prev"></button>
                    <button class="brand"></button>
                    <button class="next"></button>
                </nav>
                <div>
                    <figure class="model"></figure>
                    <figure class="refer"></figure>
                    <figure class="color"></figure>
                </div>
                <div class="bg-menu-wrapper">
                    <figure class="bg parallax-container">
                        <div class="parallax-layer bgstars"></div>
                        <div class="parallax-layer cloud1"></div>
                        <div class="parallax-layer cloud2"></div>
                        <div class="parallax-layer cloud3"></div>
                        <div class="parallax-layer cloud4"></div>
                        <div class="parallax-layer mountain3"></div>
                        <div class="parallax-layer mountain2"></div>
                        <div class="parallax-layer mountain1"></div>
                        <figure class="sp01"></figure>
                    </figure>
                    <menu>
                        <button class="btn-on"></button>
                        <button class="btn-forward"></button>
                        <button class="btn-stop"></button>
                        <button class="btn-backward"></button>
                        <button class="btn-off"></button>
                    </menu>
                </div>
            </div>
        </section>
    </main>

    <script>
        const vhc = window.matchMedia('(prefers-color-scheme: dark)');
        const vehicle = document.querySelector('.vehicle');
        const mode = document.querySelector('.mode');

        const updateTheme = (e) => vehicle.classList.toggle('dark', e.matches);

        vhc.addEventListener('change', updateTheme);
        updateTheme(vhc);

        mode.addEventListener('click', () => vehicle.classList.toggle('dark'));

        const lbrand = document.querySelector('.brand');
        const lmodel = document.querySelector('.model');
        const lrefer = document.querySelector('.refer');
        const lcolor = document.querySelector('.color');

        const bnext = document.querySelector('.next');
        const bprev = document.querySelector('.prev');

        const btnOn   = document.querySelector('.btn-on');
        const btnForw = document.querySelector('.btn-forward');
        const btnStop = document.querySelector('.btn-stop');
        const btnBack = document.querySelector('.btn-backward');
        const btnOff  = document.querySelector('.btn-off');

        const layers = document.querySelectorAll('.parallax-layer');
        const ship   = document.querySelector('.sp01');

        const vehicles = {
            attrs: [
                { brand: 'Sp01', refer: 'Space Ship X',   model: '2060', color: 'White/Red',    image: 'imgs/sp01.png' },
                { brand: 'Sp02', refer: 'Spacex Tesla 60', model: '2056', color: 'White/Orange', image: 'imgs/sp02.png' },
                { brand: 'Sp03', refer: 'Space Italic X', model: '2069', color: 'Black/Blue',   image: 'imgs/sp03.png' },
                { brand: 'Sp04', refer: 'Spa',            model: '2070', color: 'White/Blue',   image: 'imgs/sp04.png' },
            ]
        };

        class Vehicle {
            constructor(brand, refer, model, color, image) {
                this.brand = brand;
                this.refer = refer;
                this.model = model;
                this.color = color;
                this.image = image;

                this.isOn          = false;
                this.isPaused      = true;
                this.isReversed    = false;
                this.lastTimestamp = 0;

                this.speedFactors = [0.002, 0.004, 0.006, 0.008, 0.012, 0.02, 0.03, 0.06];

                this.displayData();
                this.disableButton(bprev);
            }

            disableButton(btn) {
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.2';
            }
            enableButton(btn) {
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            }

            displayData() {
                lbrand.textContent = this.brand;
                lmodel.textContent = this.model;
                lrefer.textContent = this.refer;
                lcolor.textContent = this.color;

                ship.style.opacity = '0';
                setTimeout(() => {
                    ship.style.backgroundImage = `url('${this.image}')`;
                    ship.style.opacity = '1';
                }, 150);
            }

            powerOn() {
                if (!this.isOn) {
                    this.isOn = true;
                    const start = Date.now();

                    const animate = () => {
                        if (!this.isOn) return;
                        const t = (Date.now() - start) / 1000;

                        const x   = Math.sin(t * 1.8) * 4.5;
                        const y   = Math.sin(t * 2.8) * 6.5 + Math.sin(t * 1.2) * 3;
                        const rot = Math.cos(t * 1.8) * 4.5 + Math.sin(t * 0.7) * 2.5;

                        ship.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;

                        requestAnimationFrame(animate);
                    };
                    requestAnimationFrame(animate);
                }
            }

            powerOff() {
                if (this.isOn && this.isPaused) {
                    this.isOn = false;
                    ship.style.transition = 'transform 0.5s ease-out';
                    ship.style.transform = 'translate(0, 0)';
                    setTimeout(() => ship.style.transition = '', 500);
                }
            }

            forward() {
                if (this.isOn && this.isPaused) {
                    this.lastTimestamp = 0;
                    this.isPaused      = false;
                    this.isReversed    = false;
                    requestAnimationFrame((t) => this.animateParallax(t));
                }
            }

            backward() {
                if (this.isOn && this.isPaused) {
                    this.lastTimestamp = 0;
                    this.isPaused      = false;
                    this.isReversed    = true;
                    requestAnimationFrame((t) => this.animateParallax(t));
                }
            }

            stop() {
                if (this.isOn && !this.isPaused) {
                    this.lastTimestamp = 0;
                    this.isPaused = true;
                }
            }

            animateParallax(timestamp) {
                if (!this.isPaused) {
                    const delta = timestamp - (this.lastTimestamp || timestamp);
                    this.lastTimestamp = timestamp;

                    layers.forEach((layer, index) => {
                        const speed = this.speedFactors[index] ?? 0.02;
                        let currentPos = (parseFloat(layer.dataset.pos) || 0)
                            + speed * (this.isReversed ? delta : -delta);
                        layer.style.backgroundPositionX = `${currentPos}px`;
                        layer.dataset.pos = currentPos;
                    });

                    requestAnimationFrame((t) => this.animateParallax(t));
                } else {
                    this.lastTimestamp = 0;
                }
            }
        }

        let ix = 0;

        const car = new Vehicle(
            vehicles.attrs[ix].brand,
            vehicles.attrs[ix].refer,
            vehicles.attrs[ix].model,
            vehicles.attrs[ix].color,
            vehicles.attrs[ix].image
        );

        layers.forEach(layer => layer.dataset.pos = '0');

        bnext.addEventListener('click', () => {
            if (ix < vehicles.attrs.length - 1) {
                ix++;
                car.brand = vehicles.attrs[ix].brand;
                car.model = vehicles.attrs[ix].model;
                car.refer = vehicles.attrs[ix].refer;
                car.color = vehicles.attrs[ix].color;
                car.image = vehicles.attrs[ix].image;
                car.displayData();
                car.enableButton(bprev);
                if (ix === vehicles.attrs.length - 1) car.disableButton(bnext);
            }
        });

        bprev.addEventListener('click', () => {
            if (ix > 0) {
                ix--;
                car.brand = vehicles.attrs[ix].brand;
                car.model = vehicles.attrs[ix].model;
                car.refer = vehicles.attrs[ix].refer;
                car.color = vehicles.attrs[ix].color;
                car.image = vehicles.attrs[ix].image;
                car.displayData();
                car.enableButton(bnext);
                if (ix === 0) car.disableButton(bprev);
            }
        });
        btnOn.addEventListener('click',   () => car.powerOn());
        btnForw.addEventListener('click', () => car.forward());
        btnStop.addEventListener('click', () => car.stop());
        btnBack.addEventListener('click', () => car.backward());
        btnOff.addEventListener('click',  () => car.powerOff());
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tunnel = document.querySelector('.tunnel');
            for (let s = 0; s < 4; s++) {
                const side = document.createElement('div');
                side.className = 'side';
                for (let st = 0; st < 20; st++) {
                    const stroke = document.createElement('div');
                    stroke.className = 'stroke';
                    for (let sq = 0; sq < 10; sq++) {
                        const square = document.createElement('div');
                        square.className = 'square';
                        stroke.appendChild(square);
                    }
                    side.appendChild(stroke);
                }
                tunnel.appendChild(side);
            }
            const side5 = document.createElement('div');
            side5.className = 'side';
            tunnel.appendChild(side5);
            const hl1 = document.createElement('div');
            hl1.className = 'side highlight';
            tunnel.appendChild(hl1);
            const hl2 = document.createElement('div');
            hl2.className = 'side highlight';
            tunnel.appendChild(hl2);
        });
    </script>
</body>

</html>
